<style>
html,body{margin:0}
:root{
  --d1:#86b6ef; --d2:#3987e5; --d3:#1c5cab; --r1:#f2a8a4; --r2:#e34948; --r3:#a8302f; --mid:#f0efec;
  --y1:#9fdcc4; --y2:#1baf7a; --y3:#0d7a53; --n1:#f5b49a; --n2:#eb6834; --n3:#b44a1d; --shade-op:.55;
  --water:#d6e2e6; --land:#f3f2ec; --ink:#1d2528; --ink-2:#56626a; --ink-3:#86919a;
  --panel:#fbfbf8; --line:#dde0dc; --hover:#eef0eb; --chip:#e8ebe6;
  --cd:#2450a0; --sd:#138a6e; --hd:#c4621a; --county:#6d7680;
  --sel-fill:.16; --focus:#2450a0;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --water:#0e171c; --land:#1b2327; --ink:#e7ebe8; --ink-2:#a8b2b6; --ink-3:#77838a;
    --panel:#141b1f; --line:#2a3439; --hover:#1f292e; --chip:#243036;
    --cd:#7fa6ee; --sd:#4cc9a6; --hd:#f0954e; --county:#8b959c; --focus:#7fa6ee;
    --d1:#184f95; --d2:#2a78d6; --d3:#6da7ec; --r1:#7a2524; --r2:#c83d3c; --r3:#e66767; --mid:#383835;
    --y1:#0f5e42; --y2:#199e70; --y3:#5fd0a4; --n1:#7d3413; --n2:#d95926; --n3:#f08a5d; --shade-op:.6;
  }
}
:root[data-theme="dark"]{
  --water:#0e171c; --land:#1b2327; --ink:#e7ebe8; --ink-2:#a8b2b6; --ink-3:#77838a;
  --panel:#141b1f; --line:#2a3439; --hover:#1f292e; --chip:#243036;
  --cd:#7fa6ee; --sd:#4cc9a6; --hd:#f0954e; --county:#8b959c; --focus:#7fa6ee;
  --d1:#184f95; --d2:#2a78d6; --d3:#6da7ec; --r1:#7a2524; --r2:#c83d3c; --r3:#e66767; --mid:#383835;
  --y1:#0f5e42; --y2:#199e70; --y3:#5fd0a4; --n1:#7d3413; --n2:#d95926; --n3:#f08a5d; --shade-op:.6;
}
html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:360px 1fr;height:100%}
.panel{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:12px}
h1{margin:0;font-family:var(--f-cond);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.layer{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;cursor:pointer;user-select:none;font-weight:500;font-size:13px;background:transparent;color:var(--ink)}
.layer input{position:absolute;opacity:0;pointer-events:none}
.layer .sw{width:18px;height:0;border-top:3px solid var(--c);flex:none}
.layer.county .sw{border-top-style:dashed;border-top-width:2px}
.layer .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.layer:has(input:not(:checked)){opacity:.45}
.layer:has(input:not(:checked)) .sw{border-top-color:var(--ink-3)}
.layer:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:1px}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--land);color:var(--ink)}
.search input:focus{outline:2px solid var(--focus);outline-offset:-1px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:1000;max-height:300px;overflow:auto;margin:0;padding:4px;list-style:none}
.sugg li{padding:7px 9px;border-radius:4px;cursor:pointer;display:flex;gap:8px;align-items:center}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--hover)}
.body{flex:1;overflow:auto;padding:16px 20px 20px;display:grid;align-content:start;gap:18px}
.hint{color:var(--ink-2);font-size:13.5px;max-width:34em}
.hint b{color:var(--ink);font-weight:600}
.eyebrow{font-family:var(--f-cond);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#0e171c}}
.rows{display:grid;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:5px;cursor:pointer;border:0;background:transparent;color:inherit;font:inherit;text-align:left;width:100%}
.row:hover,.row:focus-visible{background:var(--hover);outline:none}
.row .nm{font-weight:500}
.row .go{margin-left:auto;color:var(--ink-3);font-size:12px}
.dtitle{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.dtitle h2{margin:0;font-family:var(--f-cond);font-weight:700;font-size:24px;line-height:1.1}
.close{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:5px;font:inherit;font-size:12px;padding:3px 8px;cursor:pointer}
.close:hover{background:var(--hover)}
.stat{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);margin-top:4px}
.ov{display:grid;gap:1px}
.ovr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;padding:6px 8px;border-radius:5px;cursor:pointer;border:0;background:transparent;color:inherit;font:inherit;text-align:left;width:100%}
.ovr:hover,.ovr:focus-visible{background:var(--hover);outline:none}
.ovr .bar{grid-column:1 / -1;height:3px;background:var(--chip);border-radius:2px;overflow:hidden}
.ovr .bar i{display:block;height:100%;background:var(--c)}
.ovr .pct{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}

.shade{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.shade select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--land);color:var(--ink);min-width:0}
.shade select:focus-visible{outline:2px solid var(--focus);outline-offset:-1px}
.legend{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.res{display:grid;gap:10px}
.race{display:grid;gap:4px}
.race .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.race .top b{font-weight:600}
.race .mg{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.split{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--chip);gap:2px}
.split i{display:block;height:100%}
.race .sub2{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tick{position:relative}
.tick::after{content:"";position:absolute;left:60%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.maptip{position:absolute;pointer-events:none;z-index:5;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.15);white-space:nowrap}
.maptip b{font-weight:600}
.foot{padding:10px 20px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.4}
#map{height:100%;background:var(--water);position:relative}
.addr{margin:0 0 8px;font-weight:600;font-size:14px;line-height:1.35}
.pin{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--land);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.maplibregl-ctrl-group{background:var(--panel)}
.maplibregl-ctrl-group button+button{border-top-color:var(--line)}
.maplibregl-ctrl-attrib{font-size:10.5px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:52% 48%}
  .panel{order:2;border-right:0;border-top:1px solid var(--line)}
  #map{order:1}
  .head{padding:12px 16px 10px;gap:8px}
  h1{font-size:18px}.sub{display:none}
  .layers{grid-template-columns:repeat(4,1fr);gap:4px}
  .layer{padding:6px;font-size:12px;gap:5px;justify-content:center}
  .layer .n,.layer .full{display:none}
  .body{padding:12px 16px 16px}
  .foot{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app">
  <aside class="panel">
    <div class="head">
      <div>
        <h1>Florida District Overlap Map</h1>
        <p class="sub">Congressional, State Senate, State House and county lines on one map.</p>
      </div>
      <div class="layers" role="group" aria-label="Map layers">
        <label class="layer" style="--c:var(--cd)"><input type="checkbox" id="lyr-cd" data-l="cd" checked><span class="sw"></span>Congress<span class="n">28</span></label>
        <label class="layer" style="--c:var(--sd)"><input type="checkbox" id="lyr-sd" data-l="sd" checked><span class="sw"></span>Senate<span class="n">40</span></label>
        <label class="layer" style="--c:var(--hd)"><input type="checkbox" id="lyr-hd" data-l="hd"><span class="sw"></span>House<span class="n">120</span></label>
        <label class="layer county" style="--c:var(--county)"><input type="checkbox" id="lyr-county" data-l="county" checked><span class="sw"></span>County<span class="n">67</span></label>
      </div>
      <div class="shade">
        <select id="shade-by" aria-label="Shade the map by">
          <option value="">Shade map: none</option>
          <option value="pres">2024 President margin</option>
          <option value="uss">2024 U.S. Senate margin</option>
          <option value="a4">Amendment 4 (abortion) — Yes %</option>
          <option value="a3">Amendment 3 (marijuana) — Yes %</option>
        </select>
        <select id="shade-layer" aria-label="Districts to shade">
          <option value="cd">Congress</option><option value="sd">Senate</option><option value="hd">House</option><option value="county">County</option>
        </select>
        <div class="legend" id="legend" hidden></div>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="Address, district or county — e.g. HD 65, Broward" autocomplete="off" aria-label="Search an address, district or county" aria-controls="sugg">
        <ul class="sugg" id="sugg" role="listbox" hidden></ul>
      </div>
    </div>
    <div class="body" id="out"></div>
    <div class="foot">Congress: 2026 map (HB 1-D). Legislature: 2022 plans. Population: 2020 Census. 2024 results: Redistricting Data Hub, allocated to blocks and totaled within today's lines.</div>
  </aside>
  <div id="map"></div>
</div>

<script src="data/fl-districts.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
(function(){
const D = window.FLD;
// E[layer][id] = [adults, presTotal, trump, harris, scott, mucarselPowell, a3yes, a3no, a4yes, a4no]
const E = D.ex;
const pct = (a,b) => b ? a/b*100 : 0;
const METRIC = {
  pres:{label:"2024 President margin", kind:"margin", f:e=>pct(e[3]-e[2], e[2]+e[3])},
  uss:{label:"2024 U.S. Senate margin", kind:"margin", f:e=>pct(e[5]-e[4], e[4]+e[5])},
  a4:{label:"Amendment 4 Yes %", kind:"yes", f:e=>pct(e[8], e[8]+e[9])},
  a3:{label:"Amendment 3 Yes %", kind:"yes", f:e=>pct(e[6], e[6]+e[7])}
};
// margin: D minus R, two-party
const MARGIN_BINS = [[-Infinity,-30,"--r3","R+30 or more"],[-30,-15,"--r2","R+15–30"],[-15,-5,"--r1","R+5–15"],[-5,5,"--mid","Within 5"],[5,15,"--d1","D+5–15"],[15,30,"--d2","D+15–30"],[30,Infinity,"--d3","D+30 or more"]];
const YES_BINS = [[-Infinity,50,"--n3","Under 50%"],[50,55,"--n2","50–55%"],[55,60,"--n1","55–60%"],[60,65,"--y1","60–65%"],[65,70,"--y2","65–70%"],[70,Infinity,"--y3","70% or more"]];
const binsFor = m => METRIC[m].kind==="margin" ? MARGIN_BINS : YES_BINS;
function binColor(m,v){ for (const [a,b,c] of binsFor(m)) if (v>=a && v<b) return cssv(c); return cssv("--mid"); }
const fmtMargin = v => Math.abs(v)<0.05 ? "Even" : (v>0?"D+":"R+")+Math.abs(v).toFixed(1);
const LAYERS = ["county","hd","sd","cd"]; // draw order bottom→top
const META = {
  cd:{short:"CD",long:"Congressional District",min:0,w:2.6},
  sd:{short:"SD",long:"State Senate District",min:7.5,w:2},
  hd:{short:"HD",long:"State House District",min:8,w:1.2},
  county:{short:"",long:"County",min:8,w:.9}
};

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = n => n.toLocaleString("en-US");
const cname = id => (D.cn[id]||id) + " County";
const dname = (l,id) => l==="county" ? cname(id) : META[l].long+" "+id;
const dtag = (l,id) => l==="county" ? (D.cn[id]||id) : META[l].short+" "+id;

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => String(s).toLowerCase().replace(/\./g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
let hashLock=false;
function setHash(h){ hashLock=true; history.replaceState(null,"",h?"#"+h:location.pathname+location.search); setTimeout(()=>hashLock=false,0); }
// ---- geometry
const feats = {}, index = {};
for (const l of LAYERS){
  feats[l] = topojson.feature(D.topo, D.topo.objects[l]).features;
  index[l] = {};
  for (const f of feats[l]){
    const b=[180,90,-180,-90];
    const rings = f.geometry.type==="Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of rings) for (const ring of poly) for (const [x,y] of ring){ if(x<b[0])b[0]=x; if(y<b[1])b[1]=y; if(x>b[2])b[2]=x; if(y>b[3])b[3]=y; }
    f.bbox=b; f.polys=rings; index[l][f.properties.d]=f;
  }
}
function inside(f,x,y){
  if (x<f.bbox[0]||x>f.bbox[2]||y<f.bbox[1]||y>f.bbox[3]) return false;
  let c=false;
  for (const poly of f.polys) for (const r of poly){
    for (let i=0,j=r.length-1;i<r.length;j=i++){
      const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];
      if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
    }
  }
  return c;
}
function hit(l,lat,lng){ return feats[l].find(f=>inside(f,lng,lat)); }

// ---- map
const FLB = [-87.9,24.2,-79.7,31.2];
const darkQ = matchMedia("(prefers-color-scheme: dark)");
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
const esriUrl = (kind) => `${ESRI}World_${darkQ.matches?"Dark":"Light"}_Gray_${kind}/MapServer/tile/{z}/{y}/{x}`;
const ESRI_ATTR = 'Basemap &copy; <a href="https://www.esri.com">Esri</a>, HERE, Garmin, &copy; OpenStreetMap contributors';
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
const fc = f => ({type:"FeatureCollection",features:f});
const EMPTY = fc([]);
const LINE = {
  cd:{w:[5,1.6,9,2.6,13,3.6]}, sd:{w:[5,1.2,9,2,13,3]}, hd:{w:[5,.6,9,1.2,13,2.2]}, county:{w:[5,.6,9,1,13,1.6]}
};
const interp = a => ["interpolate",["linear"],["zoom"],...a];

const map = new maplibregl.Map({
  container:"map",
  bounds:[[FLB[0],FLB[1]],[FLB[2],FLB[3]]],
  fitBoundsOptions:{padding:10},
  maxBounds:[[FLB[0]-3,FLB[1]-2.5],[FLB[2]+3,FLB[3]+2.5]],
  maxZoom:17, dragRotate:false, pitchWithRotate:false, touchPitch:false,
  attributionControl:{compact:true},
  fadeDuration:150,
  style:{version:8,sources:{
      base:{type:"raster",tiles:[esriUrl("Base")],tileSize:256,maxzoom:16,bounds:FLB,attribution:ESRI_ATTR},
      ref:{type:"raster",tiles:[esriUrl("Reference")],tileSize:256,maxzoom:16,bounds:FLB}
    },
    layers:[{id:"bg",type:"background",paint:{"background-color":cssv("--water")}},{id:"base",type:"raster",source:"base"}]}
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-left");

const on = l => document.getElementById("lyr-"+l).checked;
const shadeBy = document.getElementById("shade-by"), shadeLayer = document.getElementById("shade-layer"), legend = document.getElementById("legend");
let shadeSrc = "cd";
function applyShade(){
  const m=shadeBy.value, l=shadeLayer.value;
  shadeLayer.disabled = !m;
  if (!m){ legend.hidden=true; whenReady(()=>{ map.setLayoutProperty("shade","visibility","none"); map.setPaintProperty("sel-fill","fill-opacity",.16); }); return; }
  legend.hidden=false;
  legend.innerHTML = binsFor(m).map(([,,c,lab])=>`<span><i style="background:var(${c})"></i>${lab}</span>`).join("");
  whenReady(()=>{
    if (shadeSrc!==l){
      map.removeLayer("shade");
      map.addLayer({id:"shade",type:"fill",source:l,paint:{"fill-color":"rgba(0,0,0,0)","fill-opacity":.55}},"sel-fill");
      shadeSrc=l;
    }
    const expr=["match",["get","d"]];
    for (const id of Object.keys(E[l])) expr.push(id, binColor(m, METRIC[m].f(E[l][id])));
    expr.push("rgba(0,0,0,0)");
    map.setPaintProperty("shade","fill-color",expr);
    map.setPaintProperty("shade","fill-opacity",+cssv("--shade-op")||.55);
    map.setLayoutProperty("shade","visibility","visible");
    map.setPaintProperty("sel-fill","fill-opacity",0);
  });
  const cb=document.getElementById("lyr-"+l); if(!cb.checked){ cb.checked=true; syncLayers(); }
}
shadeBy.addEventListener("change",applyShade);
shadeLayer.addEventListener("change",applyShade);
const tip=document.createElement("div"); tip.className="maptip"; tip.hidden=true;
document.getElementById("map").appendChild(tip);
function hoverTip(e){
  const m=shadeBy.value;
  if (!m){ tip.hidden=true; return; }
  const l=shadeLayer.value, f=hit(l,e.lngLat.lat,e.lngLat.lng);
  if (!f){ tip.hidden=true; return; }
  const id=f.properties.d, v=METRIC[m].f(E[l][id]);
  tip.innerHTML=`<b>${dtag(l,id)}</b> · ${METRIC[m].kind==="margin"?fmtMargin(v):v.toFixed(1)+"% Yes"}`;
  tip.style.left=(e.point.x+14)+"px"; tip.style.top=(e.point.y+14)+"px"; tip.hidden=false;
}
let pin=null, sel=null, hoverKey=null, ready=false, pending=[];
const whenReady = fn => ready ? fn() : pending.push(fn);

// labels drawn to small canvases so no font server is needed
const LBL = {cd:{size:15,weight:700,fam:"Barlow Semi Condensed"},sd:{size:13,weight:700,fam:"Barlow Semi Condensed"},hd:{size:12,weight:700,fam:"Barlow Semi Condensed"},county:{size:10.5,weight:600,fam:"Barlow Semi Condensed",upper:true,track:1}};
function labelImg(l,text){
  const S=LBL[l], pr=2, c=document.createElement("canvas"), x=c.getContext("2d");
  const font=`${S.weight} ${S.size*pr}px "${S.fam}", "Arial Narrow", sans-serif`;
  const txt=S.upper?text.toUpperCase():text;
  x.font=font; if(S.track) x.letterSpacing=(S.track*pr)+"px";
  const w=Math.ceil(x.measureText(txt).width)+8*pr, h=Math.ceil(S.size*1.5*pr);
  c.width=w; c.height=h;
  x.font=font; if(S.track) x.letterSpacing=(S.track*pr)+"px";
  x.textAlign="center"; x.textBaseline="middle"; x.lineJoin="round";
  x.strokeStyle=cssv("--land"); x.lineWidth=3.5*pr; x.strokeText(txt,w/2,h/2);
  x.fillStyle=cssv("--"+l); x.fillText(txt,w/2,h/2);
  return {width:w,height:h,data:x.getImageData(0,0,w,h).data};
}
function buildLabels(){
  for (const l of LAYERS) for (const [id] of D.lbl[l]){
    const key=`lbl-${l}-${id}`, img=labelImg(l, l==="county"?(D.cn[id]||id):id);
    if (map.hasImage(key)) map.removeImage(key);
    map.addImage(key,img,{pixelRatio:2});
  }
}

map.on("load",()=>{
  for (const l of LAYERS){
    map.addSource(l,{type:"geojson",data:fc(feats[l]),tolerance:.5});
    map.addSource("lbl-"+l,{type:"geojson",data:fc(D.lbl[l].map(([id,x,y])=>({type:"Feature",properties:{img:`lbl-${l}-${id}`},geometry:{type:"Point",coordinates:[x,y]}})))});
  }
  map.addSource("sel",{type:"geojson",data:EMPTY});
  map.addSource("hover",{type:"geojson",data:EMPTY});
  map.addLayer({id:"shade",type:"fill",source:"cd",layout:{visibility:"none"},paint:{"fill-color":"rgba(0,0,0,0)","fill-opacity":+cssv("--shade-op")||.55}});
  map.addLayer({id:"sel-fill",type:"fill",source:"sel",paint:{"fill-color":cssv("--cd"),"fill-opacity":.16}});
  map.addLayer({id:"hover-fill",type:"fill",source:"hover",paint:{"fill-color":cssv("--cd"),"fill-opacity":.12}});
  for (const l of LAYERS){
    map.addLayer({id:"line-"+l,type:"line",source:l,layout:{"line-join":"round"},paint:{
      "line-color":cssv("--"+l),"line-width":interp(LINE[l].w),"line-opacity":l==="county"?.8:.92,
      ...(l==="county"?{"line-dasharray":[3,2.5]}:{})}});
  }
  map.addLayer({id:"sel-line",type:"line",source:"sel",layout:{"line-join":"round"},paint:{"line-color":cssv("--cd"),"line-width":4}});
  map.addLayer({id:"hover-line",type:"line",source:"hover",layout:{"line-join":"round"},paint:{"line-color":cssv("--cd"),"line-width":3,"line-dasharray":[2,1.5]}});
  map.addLayer({id:"ref",type:"raster",source:"ref"});
  const minz={cd:0,sd:7.5,hd:8,county:8};
  for (const l of ["county","hd","sd","cd"]){
    map.addLayer({id:"lbl-"+l,type:"symbol",source:"lbl-"+l,minzoom:minz[l],layout:{
      "icon-image":["get","img"],"icon-allow-overlap":false,"icon-padding":2,"symbol-sort-key":{cd:0,sd:1,hd:2,county:3}[l]}});
  }
  buildLabels();
  map.setMinZoom(Math.max(4.5,map.getZoom()-.5));
  ready=true; pending.splice(0).forEach(fn=>fn());
  syncLayers(); drawHighlight();
});
document.fonts && document.fonts.ready.then(()=>whenReady(buildLabels));

let baseErrs=0, useOSM=false;
map.on("error",e=>{
  if (useOSM || !e || e.sourceId!=="base") return;
  if (++baseErrs>=4){
    useOSM=true;
    map.removeLayer("ref"); 
    map.getSource("base").setTiles(["https://tile.openstreetmap.org/{z}/{x}/{y}.png"]);
    map.setPaintProperty("base","raster-opacity",.7);
  }
});

function restyle(){
  whenReady(()=>{
    map.setPaintProperty("bg","background-color",cssv("--water"));
    if (!useOSM){ map.getSource("base").setTiles([esriUrl("Base")]); map.getSource("ref").setTiles([esriUrl("Reference")]); }
    for (const l of LAYERS) map.setPaintProperty("line-"+l,"line-color",cssv("--"+l));
    buildLabels(); drawHighlight(); applyShade();
  });
}
function syncLayers(){
  whenReady(()=>{
    for (const l of LAYERS){
      const v=on(l)?"visible":"none";
      map.setLayoutProperty("line-"+l,"visibility",v);
      map.setLayoutProperty("lbl-"+l,"visibility",v);
    }
    map.setLayerZoomRange("lbl-cd",0,on("hd")?10.5:24);
  });
}
function drawHighlight(){
  whenReady(()=>{
    if (sel){
      const c=cssv("--"+sel.l);
      map.getSource("sel").setData(index[sel.l][sel.id]);
      map.setPaintProperty("sel-fill","fill-color",c); map.setPaintProperty("sel-line","line-color",c);
    } else map.getSource("sel").setData(EMPTY);
    if (hoverKey){
      const [l,id]=hoverKey, c=cssv("--"+l);
      map.getSource("hover").setData(index[l][id]);
      map.setPaintProperty("hover-fill","fill-color",c); map.setPaintProperty("hover-line","line-color",c);
    } else map.getSource("hover").setData(EMPTY);
  });
}
function setPin(lat,lng){
  if (pin) pin.remove();
  const el=document.createElement("div"); el.className="pin";
  pin=new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);
}
function clearPin(){ if(pin){ pin.remove(); pin=null; } }
const fly = (lat,lng,z) => map.flyTo({center:[lng,lat],zoom:Math.max(map.getZoom(),z),duration:700,essential:true});
const flyBox = b => map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:40,duration:700,essential:true});

// ---- panel
const out=document.getElementById("out");
function intro(){
  out.innerHTML = `<div class="hint"><b>Search an address or click the map</b> to see every district that covers that spot. Search a district or county to see which others overlap it and how many people they share.</div>
  <div><p class="eyebrow">Try one</p><div class="rows">
    ${[["hd","65"],["sd","20"],["cd","14"],["county","011"]].map(([l,id])=>rowBtn(l,id)).join("")}
  </div></div>`;
}
function rowBtn(l,id,extra=""){
  return `<button class="row" data-l="${l}" data-id="${id}"><span class="tag" style="--c:var(--${l})">${l==="county"?"CO":META[l].short}</span><span class="nm">${dname(l,id)}</span>${extra}<span class="go">→</span></button>`;
}
function showPoint(lat,lng,label,zoom){
  sel=null; hoverKey=null; drawHighlight();
  setHash(`pt=${lat.toFixed(5)},${lng.toFixed(5)}`);
  if (zoom) fly(lat,lng,13);
  setPin(lat,lng);
  const found=["cd","sd","hd","county"].map(l=>[l,hit(l,lat,lng)]).filter(x=>x[1]);
  if (!found.length){ out.innerHTML=`<div class="hint">No Florida district there. That spot is offshore or outside the state.</div>`; return; }
  out.innerHTML = `<div>${label?`<p class="addr">${esc(label)}</p>`:""}<p class="eyebrow">At this spot · ${lat.toFixed(4)}, ${lng.toFixed(4)}</p>
    <div class="rows">${found.map(([l,f])=>rowBtn(l,f.properties.d)).join("")}</div></div>
    <div class="hint">Pick one to see everything it overlaps.</div>`;
}
function race(title, dName, dV, rName, rV, total){
  const two=dV+rV, dp=pct(dV,total), rp=pct(rV,total), m=pct(dV-rV,two);
  return `<div class="race"><div class="top"><b>${title}</b><span class="mg">${fmtMargin(m)}</span></div>
    <div class="split" role="img" aria-label="${dName} ${dp.toFixed(1)}%, ${rName} ${rp.toFixed(1)}%"><i style="width:${dp}%;background:var(--d2)"></i><i style="flex:1;background:var(--chip)"></i><i style="width:${rp}%;background:var(--r2)"></i></div>
    <div class="sub2"><span>${dName} ${dp.toFixed(1)}%</span><span>${rName} ${rp.toFixed(1)}%</span></div></div>`;
}
function amend(title, y, n){
  const yp=pct(y,y+n), pass=yp>=60;
  return `<div class="race"><div class="top"><b>${title}</b><span class="mg">${yp.toFixed(1)}% Yes</span></div>
    <div class="split tick" role="img" aria-label="${yp.toFixed(1)} percent yes; 60 percent needed"><i style="width:${yp}%;background:var(${pass?"--y2":"--n2"})"></i></div>
    <div class="sub2"><span>${fmt(y)} yes · ${fmt(n)} no</span><span>60% needed</span></div></div>`;
}
function results(l,id){
  const e=E[l][id]; if(!e) return "";
  return `<div><p class="eyebrow">2024 results within today's lines</p><div class="res">
    ${race("President","Harris",e[3],"Trump",e[2],e[1])}
    ${race("U.S. Senate","Mucarsel-Powell",e[5],"Scott",e[4],e[4]+e[5]+Math.max(0,e[1]-e[2]-e[3])*0)}
    ${amend("Amendment 4 · abortion",e[8],e[9])}
    ${amend("Amendment 3 · marijuana",e[6],e[7])}
    <div class="sub2"><span>${fmt(e[1])} votes for president</span><span>${fmt(e[0])} adults (2020)</span></div>
  </div></div>`;
}
function select(l,id,zoom=true){
  const f=index[l][id]; if(!f) return;
  sel={l,id}; hoverKey=null;
  setHash(l==="county" ? "county-"+slug(D.cn[id]||id) : l+"-"+id);
  clearPin();
  const cb=document.getElementById("lyr-"+l); if(!cb.checked){ cb.checked=true; syncLayers(); }
  drawHighlight();
  if (zoom) flyBox(f.bbox);
  const o=D.ov[l][id], pop=o.pop;
  const sections=["cd","sd","hd","county"].filter(k=>k!==l).map(k=>{
    const list=(o[k]||[]).filter(([,p])=>p>=Math.max(100,pop*.002));
    const title={cd:"Congressional districts",sd:"State Senate districts",hd:"State House districts",county:"Counties"}[k];
    return `<div><p class="eyebrow">${title} · ${list.length}</p><div class="ov">${list.map(([oid,p])=>{
      const pct=p/pop*100, whole=D.ov[k][oid].pop, ofThat=p/whole*100;
      return `<button class="ovr" data-l="${k}" data-id="${oid}" title="${fmt(p)} people · ${ofThat.toFixed(0)}% of ${dtag(k,oid)}">
        <span class="tag" style="--c:var(--${k})">${k==="county"?"CO":META[k].short}</span>
        <span class="nm">${k==="county"?cname(oid):META[k].short+" "+oid}</span>
        <span class="pct">${pct>=99.5?"all":pct<1?"<1%":pct.toFixed(0)+"%"}</span>
        <span class="bar" style="--c:var(--${k})"><i style="width:${Math.max(pct,1.5)}%"></i></span></button>`;}).join("")}</div></div>`;
  }).join("");
  out.innerHTML = `<div><div class="dtitle"><h2>${dname(l,id)}</h2><button class="close" id="clear">Clear</button></div>
    <div class="stat">${fmt(pop)} residents (2020)</div></div>
    <div class="hint" style="font-size:12.5px">Share of this district's residents in each overlapping district. Hover to outline it on the map; click to jump to it.</div>
    ${results(l,id)}
    ${sections}`;
  out.scrollTop=0;
}
out.addEventListener("click",e=>{
  if (e.target.id==="clear"){ sel=null; hoverKey=null; drawHighlight(); setHash(""); intro(); return; }
  const g=e.target.closest(".geo"); if(g){ q.value=""; showPoint(+g.dataset.lat,+g.dataset.lon,g.dataset.name,true); return; }
  const b=e.target.closest("[data-l]"); if(b) select(b.dataset.l,b.dataset.id);
});
out.addEventListener("mouseover",e=>{
  const b=e.target.closest(".ovr"); const k=b?[b.dataset.l,b.dataset.id]:null;
  if (String(k)!==String(hoverKey)){ hoverKey=k; drawHighlight(); }
});
out.addEventListener("mouseleave",()=>{ if(hoverKey){hoverKey=null; drawHighlight();} });
map.on("click",e=>showPoint(e.lngLat.lat,e.lngLat.lng));
let tipRaf=0;
map.on("mousemove",e=>{ if(tipRaf) return; tipRaf=requestAnimationFrame(()=>{tipRaf=0; hoverTip(e);}); });
map.getCanvas().addEventListener("mouseleave",()=>{ tip.hidden=true; });
map.on("movestart",()=>{ tip.hidden=true; });
document.querySelectorAll(".layers input").forEach(i=>i.addEventListener("change",()=>{
  if (!i.checked && sel && sel.l===i.dataset.l){ sel=null; drawHighlight(); intro(); }
  syncLayers();
}));

// ---- search
const ALL=[];
for (const l of ["cd","sd","hd"]) for (const id of Object.keys(index[l]).sort((a,b)=>a-b))
  ALL.push({l,id,keys:[`${META[l].short} ${id}`, `${META[l].short}${id}`, `${META[l].long} ${id}`, `${{cd:"congress",sd:"senate",hd:"house"}[l]} ${id}`].map(s=>s.toLowerCase())});
for (const id of Object.keys(index.county).sort((a,b)=>(D.cn[a]||"").localeCompare(D.cn[b]||"")))
  ALL.push({l:"county",id,keys:[(D.cn[id]||"").toLowerCase(), cname(id).toLowerCase()]});
const q=document.getElementById("q"), sugg=document.getElementById("sugg");
let hits=[], active=0;
function renderSugg(){
  const raw=q.value.trim();
  if (raw.length>=4 && !hits.some(h=>h.addr)) hits.push({addr:raw});
  if(!hits.length){ sugg.hidden=true; q.setAttribute("aria-expanded","false"); return; }
  sugg.innerHTML=hits.map((h,i)=>(h.addr ? `<li role="option" id="s${i}" aria-selected="${i===active}" data-i="${i}"><span class="tag" style="--c:var(--ink-2)">ADDR</span>Search address “${esc(h.addr)}”</li>` : `<li role="option" id="s${i}" aria-selected="${i===active}" data-i="${i}"><span class="tag" style="--c:var(--${h.l})">${h.l==="county"?"CO":META[h.l].short}</span>${dname(h.l,h.id)}</li>`)).join("");
  sugg.hidden=false; q.setAttribute("aria-expanded","true");
}
q.addEventListener("input",()=>{
  const s=q.value.trim().toLowerCase().replace(/\s+/g," ").replace(/^(district|dist)\s*/,"");
  if(!s){hits=[];sugg.hidden=true;return;}
  const exact=[],starts=[],contains=[];
  for (const a of ALL){
    if (a.keys.some(k=>k===s)) exact.push(a);
    else if (a.keys.some(k=>k.startsWith(s))) starts.push(a);
    else if (a.keys.some(k=>k.includes(s))) contains.push(a);
  }
  hits=[...exact,...starts,...contains].slice(0,8); active=0; renderSugg();
});
function pick(i){
  const h=hits[i]; if(!h) return;
  hits=[]; sugg.hidden=true;
  if (h.addr) { geocode(h.addr); return; }
  q.value=""; select(h.l,h.id);
}
let lastGeo=0;
async function geocode(text){
  const wait=Math.max(0,1100-(Date.now()-lastGeo)); if(wait) await new Promise(r=>setTimeout(r,wait));
  lastGeo=Date.now();
  out.innerHTML=`<div class="hint">Looking up “${esc(text)}”…</div>`;
  const qs=/\b(fl|florida)\b/i.test(text)?text:text+", Florida";
  const url="https://nominatim.openstreetmap.org/search?"+new URLSearchParams({format:"jsonv2",q:qs,countrycodes:"us",viewbox:"-87.8,31.1,-79.8,24.3",bounded:"1",limit:"5",addressdetails:"0"});
  try{
    const r=await fetch(url,{headers:{"Accept":"application/json"}});
    if(!r.ok) throw new Error(r.status);
    const res=await r.json();
    if(!res.length){ out.innerHTML=`<div class="hint">No match for “${esc(text)}”. Try adding the city, or click the spot on the map.</div>`; return; }
    if(res.length===1){ const x=res[0]; showPoint(+x.lat,+x.lon,x.display_name,true); return; }
    out.innerHTML=`<div><p class="eyebrow">Which one?</p><div class="rows">${res.map((x,i)=>`<button class="row geo" data-lat="${x.lat}" data-lon="${x.lon}" data-name="${esc(x.display_name)}"><span class="nm">${esc(x.display_name.replace(/, United States$/,""))}</span><span class="go">→</span></button>`).join("")}</div></div>`;
  }catch(err){
    out.innerHTML=`<div class="hint">Address search isn't responding right now. Click the spot on the map instead.</div>`;
  }
}
q.addEventListener("keydown",e=>{
  if(sugg.hidden) return;
  if(e.key==="ArrowDown"){active=Math.min(active+1,hits.length-1);renderSugg();e.preventDefault();}
  else if(e.key==="ArrowUp"){active=Math.max(active-1,0);renderSugg();e.preventDefault();}
  else if(e.key==="Enter"){pick(active);e.preventDefault();}
  else if(e.key==="Escape"){hits=[];renderSugg();}
});
sugg.addEventListener("mousedown",e=>{ const li=e.target.closest("li"); if(li){ e.preventDefault(); pick(+li.dataset.i);} });
q.addEventListener("blur",()=>setTimeout(()=>{hits=[];renderSugg();},120));

// ---- theme
darkQ.addEventListener("change",restyle);

function fromHash(){
  const h=decodeURIComponent(location.hash.slice(1)).toLowerCase();
  let m;
  if ((m=h.match(/^(cd|sd|hd)-(\d+)$/)) && index[m[1]][String(+m[2])]) return select(m[1],String(+m[2])), true;
  if ((m=h.match(/^county-(.+)$/))){ const id=Object.keys(D.cn).find(k=>slug(D.cn[k])===m[1]); if(id) return select("county",id), true; }
  if ((m=h.match(/^pt=(-?[\d.]+),(-?[\d.]+)$/))) return showPoint(+m[1],+m[2],null,true), true;
  if ((m=h.match(/^layers=([a-z,]+)$/))) { const s=m[1].split(","); for(const l of LAYERS) document.getElementById("lyr-"+l).checked=s.includes(l); syncLayers(); }
  return false;
}
addEventListener("hashchange",()=>{ if(!hashLock) fromHash(); });
if(!fromHash()) intro();
})();
</script>
</body>
</html>
